[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcr-selectivitymap"
version = "0.4.0"
description = "Static GPCR profiling and phylogeny-aware representation benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hossein Batebi", email = "hossein.batebi@fu-berlin.de"}]
keywords = ["GPCR", "structural bioinformatics", "phylogeny", "sequence identity", "electrostatics", "contact networks", "normal modes", "protein interfaces", "reproducibility"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "biopython>=1.81", "scikit-learn>=1.3", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
gpcr-selectivitymap = "gpcr_selectivitymap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
